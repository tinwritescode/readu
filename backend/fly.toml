# fly.toml app configuration file generated for vtts-backend on 2026-10-18T12:30:16+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vtts-backend'
primary_region = 'sin'

[build]
[env]
  CACHE_DIR = '/tmp/cache'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
